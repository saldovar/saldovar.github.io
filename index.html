<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archivo — Biblioteca personal de vídeo</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ===================== CABECERA ===================== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">▮▮</span>
        <div class="brand-text">
          <span class="brand-name" id="siteName">Archivo</span>
          <span class="brand-tagline" id="siteDescription">Tu colección personal de vídeo</span>
        </div>
      </div>

      <div class="search-wrap">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Buscar por título, categoría, temporada, episodio, tag o descripción..."
          autocomplete="off"
        />
      </div>

      <nav class="quick-nav">
        <button class="nav-link" data-scroll="continueSection">Continuar</button>
        <button class="nav-link" data-scroll="favoritesSection">Favoritos</button>
        <button class="nav-link" data-scroll="librarySection">Biblioteca</button>
      </nav>
    </div>
  </header>

  <!-- ===================== VISTA PRINCIPAL ===================== -->
  <main id="mainView">

    <!-- Categorías -->
    <section class="category-bar" aria-label="Filtrar por categoría">
      <div id="categoryList" class="category-list"></div>
    </section>

    <!-- Continuar viendo -->
    <section id="continueSection" class="shelf" hidden>
      <h2 class="shelf-title">Continuar viendo</h2>
      <div id="continueRow" class="card-row"></div>
    </section>

    <!-- Favoritos -->
    <section id="favoritesSection" class="shelf" hidden>
      <h2 class="shelf-title">Favoritos</h2>
      <div id="favoritesRow" class="card-row"></div>
    </section>

    <!-- Biblioteca completa -->
    <section id="librarySection" class="shelf">
      <div class="shelf-header">
        <h2 class="shelf-title">Biblioteca</h2>
        <div class="sort-wrap">
          <label for="sortSelect" class="sort-label">Ordenar</label>
          <select id="sortSelect" class="sort-select">
            <option value="recent">Más recientes</option>
            <option value="title">Título (A-Z)</option>
            <option value="season">Temporada / episodio</option>
            <option value="category">Categoría</option>
          </select>
        </div>
      </div>
      <div id="libraryGrid" class="card-grid"></div>
      <p id="emptyState" class="empty-state" hidden>No se encontró ningún vídeo con esos criterios.</p>
    </section>

  </main>

  <!-- ===================== VISTA DE REPRODUCCIÓN ===================== -->
  <section id="playerView" class="player-view" hidden>

    <button id="backToLibrary" class="back-button" aria-label="Volver a la biblioteca">
      <span aria-hidden="true">←</span> Biblioteca
    </button>

    <div class="player-stage">
      <video id="videoPlayer" playsinline></video>

      <div class="player-controls" id="playerControls">
        <div class="progress-row">
          <span id="timeCurrent" class="time-label">0:00</span>
          <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" step="0.1" />
          <span id="timeDuration" class="time-label">0:00</span>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button id="playPauseBtn" class="control-btn" aria-label="Reproducir / Pausar">▶</button>
            <button id="prevEpisodeBtn" class="control-btn" aria-label="Episodio anterior">⏮</button>
            <button id="nextEpisodeBtn" class="control-btn" aria-label="Siguiente episodio">⏭</button>

            <div class="volume-wrap">
              <button id="muteBtn" class="control-btn" aria-label="Silenciar">🔊</button>
              <input type="range" id="volumeBar" class="volume-bar" min="0" max="1" step="0.01" value="1" />
            </div>
          </div>

          <div class="controls-right">
            <select id="speedSelect" class="speed-select" aria-label="Velocidad de reproducción">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
            <button id="favoriteBtn" class="control-btn favorite-btn" aria-label="Añadir a favoritos">☆</button>
            <button id="fullscreenBtn" class="control-btn" aria-label="Pantalla completa">⛶</button>
          </div>
        </div>
      </div>
    </div>

    <div class="player-info">
      <h1 id="playerTitle" class="player-title">—</h1>
      <p id="playerMeta" class="player-meta">—</p>
      <p id="playerDescription" class="player-description">—</p>
    </div>

    <div class="related-section">
      <h2 class="shelf-title">Episodios relacionados</h2>
      <div id="relatedRow" class="card-row"></div>
    </div>
  </section>

  <footer class="site-footer">
    <p>Los vídeos se reproducen directamente desde sus servidores de origen. Este sitio no aloja ni almacena archivos de vídeo.</p>
  </footer>

  <!-- Orden de carga: config antes que app -->
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>

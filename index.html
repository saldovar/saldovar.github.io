<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Costos ML — Portal Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a25;
    --border: #2a2a3a;
    --accent: #FFE033;
    --accent2: #3BFFA0;
    --red: #FF4545;
    --orange: #FF8C00;
    --text: #f0f0f8;
    --muted: #6b6b8a;
    --font-mono: 'Space Mono', monospace;
    --font-display: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    padding: 40px 20px;
    background-image: 
      radial-gradient(ellipse at 20% 0%, rgba(255,224,51,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(59,255,160,0.03) 0%, transparent 60%);
  }

  header {
    max-width: 860px;
    margin: 0 auto 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    line-height: 1.7;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  input[type="number"], input[type="text"], select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,224,51,0.08);
  }

  select option { background: #1a1a25; }

  .toggle-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .toggle-btn {
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-weight: 700;
  }

  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .toggle-btn:hover:not(.active) {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Results Panel */
  .results-panel {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    display: none;
  }

  .results-panel.visible { display: block; }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .result-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .result-card.highlight {
    border-color: var(--accent2);
    background: rgba(59,255,160,0.05);
  }

  .result-card.danger {
    border-color: var(--red);
    background: rgba(255,69,69,0.06);
  }

  .result-card.warning {
    border-color: var(--orange);
    background: rgba(255,140,0,0.06);
  }

  .rc-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rc-value {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .rc-value.green { color: var(--accent2); }
  .rc-value.red { color: var(--red); }
  .rc-value.yellow { color: var(--accent); }
  .rc-value.orange { color: var(--orange); }

  .rc-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  /* Breakdown table */
  .breakdown {
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  .breakdown-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(42,42,58,0.5);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row .item { color: var(--muted); }
  .breakdown-row .amount { color: var(--text); font-weight: 700; }
  .breakdown-row .amount.neg { color: var(--red); }
  .breakdown-row .amount.pos { color: var(--accent2); }
  .breakdown-row.total-row {
    border-top: 2px solid var(--border);
    margin-top: 4px;
    padding-top: 12px;
    font-size: 15px;
  }

  /* Alert */
  .alert {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-family: var(--font-mono);
    line-height: 1.6;
    border: 1px solid;
  }

  .alert.danger { background: rgba(255,69,69,0.08); border-color: var(--red); color: #ffaaaa; }
  .alert.warning { background: rgba(255,140,0,0.08); border-color: var(--orange); color: #ffd080; }
  .alert.ok { background: rgba(59,255,160,0.08); border-color: var(--accent2); color: #aaffe0; }
  .alert.show { display: block; }

  /* CTA */
  .calc-btn {
    width: 100%;
    margin-top: 4px;
    padding: 14px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .calc-btn:hover { background: #fff; transform: translateY(-1px); }
  .calc-btn:active { transform: translateY(0); }

  /* Profit meter */
  .meter-wrap {
    margin: 20px 0 8px;
  }

  .meter-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .meter-bar {
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .meter-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1), background 0.4s;
  }

  .chip {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 1px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .chip-yellow { background: rgba(255,224,51,0.15); color: var(--accent); border: 1px solid rgba(255,224,51,0.3); }
  .chip-green { background: rgba(59,255,160,0.15); color: var(--accent2); border: 1px solid rgba(59,255,160,0.3); }
  .chip-red { background: rgba(255,69,69,0.15); color: var(--red); border: 1px solid rgba(255,69,69,0.3); }

  /* Suggestion box */
  .suggestion-box {
    display: none;
    margin-top: 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .suggestion-box.show { display: block; }

  .suggestion-header {
    background: var(--surface2);
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .suggestion-header span { color: var(--accent); }

  .suggestion-target-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .suggestion-target-wrap label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0;
    white-space: nowrap;
  }

  .target-input {
    width: 80px !important;
    padding: 6px 10px !important;
    font-size: 13px !important;
    border-radius: 6px !important;
  }

  .recalc-btn {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 700;
  }

  .recalc-btn:hover { background: var(--accent); color: #000; }

  .suggestion-rows {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }

  .sug-item {
    padding: 18px 20px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .sug-item:last-child { border-right: none; }

  .sug-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sug-price {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .sug-detail {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    line-height: 1.5;
  }

  .sug-detail strong { color: var(--accent2); }


  /* ── TAB NAVIGATION ── */
  .tab-nav {
    max-width: 860px;
    margin: 0 auto 24px;
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .tab-btn {
    padding: 10px 22px 12px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-pane { display: none; }
  .tab-pane.active { display: contents; }

  /* Colecta tab pane needs block not contents */
  .tab-pane.colecta-pane { display: none; }
  .tab-pane.colecta-pane.active { display: block; }

  /* ── COLECTA TAB STYLES ── */
  .colecta-container {
    max-width: 860px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .dim-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .dim-grid input {
    text-align: center;
  }

  .dim-label {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .vol-display {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }

  .vol-display .vol-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .vol-display .vol-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--accent2);
  }

  .colecta-result {
    grid-column: 1 / -1;
    display: none;
  }

  .colecta-result.visible { display: block; }

  .colecta-result-inner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }

  .tramo-badge {
    display: inline-block;
    background: rgba(255,224,51,0.1);
    border: 1px solid rgba(255,224,51,0.3);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    font-weight: 700;
  }

  .colecta-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .colecta-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 20px;
  }

  .colecta-table th {
    text-align: left;
    padding: 8px 12px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .colecta-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(42,42,58,0.4);
    color: var(--muted);
  }

  .colecta-table tr.active-row td {
    color: var(--text);
    background: rgba(255,224,51,0.05);
    font-weight: 700;
  }

  .colecta-table tr.active-row td:first-child {
    border-left: 2px solid var(--accent);
  }

  .note-box {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(59,255,160,0.05);
    border: 1px solid rgba(59,255,160,0.2);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #aaffe0;
    line-height: 1.7;
  }

  .qty-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .qty-wrap input {
    width: 80px;
  }


  /* ── CATÁLOGO TAB ── */
  .catalogo-pane { display: none; }
  .catalogo-pane.active { display: block; }

  .cat-container {
    max-width: 860px;
    margin: 0 auto;
  }

  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .scard { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
  .scard .val { font-size:22px; font-weight:800; font-family:var(--font-mono); line-height:1; margin-bottom:3px; }
  .scard .lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; }

  .cat-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .cat-tab { padding:5px 14px; border:1px solid var(--border); border-radius:20px; background:var(--surface2); color:var(--muted); font-size:11px; cursor:pointer; font-weight:600; transition:all .15s; }
  .cat-tab.active, .cat-tab:hover { border-color:var(--accent); color:var(--accent); }

  .tbl-wrap { overflow-x:auto; }
  .cat-table { width:100%; border-collapse:collapse; }
  .cat-table thead th {
    font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px;
    padding:8px 10px; text-align:left; border-bottom:1px solid var(--border);
    font-family:var(--font-mono); white-space:nowrap;
  }
  .cat-table tbody tr { border-bottom:1px solid rgba(44,44,61,0.5); transition:background .1s; }
  .cat-table tbody tr:hover { background:rgba(255,255,255,0.03); }
  .cat-table td { padding:9px 10px; font-family:var(--font-mono); font-size:12px; vertical-align:middle; }
  .cat-table td.td-name { color:var(--text); font-family:var(--font-display); font-size:12px; font-weight:600; max-width:220px; }

  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:700; font-family:var(--font-mono); letter-spacing:.5px; }
  .badge-green { background:rgba(59,255,160,.12); color:var(--accent2); border:1px solid rgba(59,255,160,.25); }
  .badge-yellow { background:rgba(255,224,51,.12); color:var(--accent); border:1px solid rgba(255,224,51,.25); }
  .badge-orange { background:rgba(255,140,0,.12); color:var(--orange); border:1px solid rgba(255,140,0,.25); }
  .badge-red { background:rgba(255,69,69,.12); color:var(--red); border:1px solid rgba(255,69,69,.25); }

  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot-green { background:var(--accent2); }
  .dot-yellow { background:var(--accent); }
  .dot-orange { background:var(--orange); }
  .dot-red { background:var(--red); }

  .cat-alert { margin-top:16px; padding:10px 14px; border-radius:8px; font-size:11px; font-family:var(--font-mono); line-height:1.7; }
  .cat-alert-red { background:rgba(255,69,69,.08); border:1px solid rgba(255,69,69,.3); color:#ffa0a0; }
  .cat-alert-orange { background:rgba(255,140,0,.08); border:1px solid rgba(255,140,0,.3); color:#ffd080; }
  .cat-alert-green { background:rgba(59,255,160,.08); border:1px solid rgba(59,255,160,.3); color:#a0ffe0; }

  .legend { display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .leg { font-size:10px; color:var(--muted); display:flex; align-items:center; }

  .cat-sub { font-size:11px; color:var(--muted); font-family:var(--font-mono); margin-bottom:18px; }

  footer {
    max-width: 860px;
    margin: 32px auto 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  @media (max-width: 620px) {
    .container { grid-template-columns: 1fr; }
    .results-panel { grid-column: 1; }
    .result-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-tag">Portal Tech &amp; Gaming</span>
    <h1>Simulador de<br><span>Costos ML</span></h1>
  </div>
  <div class="subtitle">
    Comisión · Cargo fijo · Envío<br>
    Neto real · % que se lleva ML<br>
    v1.0 — mercadolibre.com.ar
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('costos')">💰 Costos ML</button>
  <button class="tab-btn" onclick="switchTab('colecta')">🚚 Colecta Full</button>
  <button class="tab-btn" onclick="switchTab('catalogo')">📦 Mapa Catálogo</button>
</div>

<div class="tab-pane active" id="tab-costos">
<div class="container">

  <!-- Input: Producto -->
  <div class="panel">
    <div class="panel-title">Datos del Producto</div>

    <div class="field">
      <label>Nombre del Producto</label>
      <input type="text" id="productName" placeholder="Ej: Teclado Redragon K552" />
    </div>

    <div class="field">
      <label>Precio de Venta (ARS $)</label>
      <input type="number" id="salePrice" placeholder="0" min="0" />
    </div>

    <div class="field">
      <label>Costo del Producto (ARS $)</label>
      <input type="number" id="costPrice" placeholder="0 (opcional)" min="0" />
    </div>

    <div class="field">
